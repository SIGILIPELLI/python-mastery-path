name: Deploy MkDocs site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material pymdown-extensions ghp-import
      - run: mkdocs build
      - run: mkdocs build
        working-directory: vector-databases-mastery-path
      - run: ghp-import -p -f -m "Deploy site (main + vector-databases-mastery-path)" site
