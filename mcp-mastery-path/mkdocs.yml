site_name: MCP Mastery Path
site_description: A structured, module-wise Model Context Protocol (MCP) training program from entry level to master level.
site_url: https://sigilipelli.github.io/python-mastery-path/mcp-mastery-path/
repo_url: https://github.com/sigilipelli/python-mastery-path
repo_name: python-mastery-path
edit_uri: edit/main/mcp-mastery-path/docs/
site_dir: ../site/mcp-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · What Is MCP & Why It Exists": level-1/01-what-is-mcp.md
      - "02 · JSON-RPC 2.0: The Wire Protocol Underneath": level-1/02-json-rpc-basics.md
      - "03 · MCP Architecture: Hosts, Clients & Servers": level-1/03-architecture-hosts-clients-servers.md
      - "04 · Setup: Python SDK & Your First Server": level-1/04-setup-python-sdk.md
      - "05 · Tools: Exposing Functions to an LLM": level-1/05-tools-basics.md
      - "06 · Resources: Exposing Data to an LLM": level-1/06-resources-basics.md
      - "07 · Prompts: Reusable Prompt Templates": level-1/07-prompts-basics.md
      - "08 · The stdio Transport & Local Servers": level-1/08-stdio-transport.md
      - "09 · Connecting Your Server to Claude Desktop": level-1/09-claude-desktop-integration.md
      - "10 · Project — A Local Notes/Tasks MCP Server": level-1/10-project-notes-server.md
  - "Level 2 · Intermediate":
      - Overview: level-2/index.md
