site_name: Vector Databases Mastery Path
site_description: A structured, module-wise Vector Databases training program from entry level to master level.
site_url: https://sigilipelli.github.io/python-mastery-path/vector-databases-mastery-path/
repo_url: https://github.com/sigilipelli/python-mastery-path
repo_name: python-mastery-path
edit_uri: edit/main/vector-databases-mastery-path/docs/
site_dir: ../site/vector-databases-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · What Are Embeddings & Why Vector Search": level-1/01-embeddings-intro.md
      - "02 · Setup: Python, NumPy & Your First Vectors": level-1/02-setup-numpy.md
      - "03 · Distance Metrics (Cosine, Euclidean, Dot Product)": level-1/03-distance-metrics.md
      - "04 · Brute-Force Similarity Search": level-1/04-brute-force-search.md
      - "05 · Generating Real Embeddings": level-1/05-generating-embeddings.md
      - "06 · Intro to Approximate Nearest Neighbor Search": level-1/06-ann-intro.md
      - "07 · Your First Vector DB: Chroma": level-1/07-chroma-basics.md
      - "08 · Indexing & Querying Basics": level-1/08-indexing-querying.md
      - "09 · Metadata Filtering": level-1/09-metadata-filtering.md
      - "10 · Project — Semantic Search CLI": level-1/10-project-semantic-search-cli.md
  - "Level 2 · Intermediate":
      - Overview: level-2/index.md
      - "01 · Pinecone Fundamentals": level-2/01-pinecone-fundamentals.md
