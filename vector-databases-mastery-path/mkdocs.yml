      - "07 · Choosing the Right Index": level-2/07-choosing-index.md
      - "08 · Batch Upserts & Data Pipelines": level-2/08-batch-upserts-pipelines.md
      - "09 · Namespaces, Sharding & Multi-Tenancy": level-2/09-namespaces-sharding.md
